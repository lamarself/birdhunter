<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة صياد الطيور</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            cursor: crosshair;
        }
        #info {
            margin-top: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>لعبة صياد الطيور</h1>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="info">اضغط بالماوس على الطائر لإطلاق النار وصيده!</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // إعدادات النقاط
        let score = 0;
        let ammo = 3;

        // إعدادات الطائر (الفريسة)
        let bird = {
            x: 100,
            y: 150,
            radius: 20,
            speedX: 3,
            speedY: 2,
            alive: true
        };

        // تحديث موقع الطائر
        function updateBird() {
            if (bird.alive) {
                bird.x += bird.speedX;
                bird.y += bird.speedY;

                // ارتطام الحواف لكي يستمر الطائر في الحركة داخل الشاشة
                if (bird.x - bird.radius < 0 || bird.x + bird.radius > canvas.width) {
                    bird.speedX *= -1;
                }
                if (bird.y - bird.radius < 0 || bird.y + bird.radius > canvas.height - 150) {
                    bird.speedY *= -1;
                }
            } else {
                // إذا أصيب الطائر، يسقط للأرض
                bird.y += 6;
                if (bird.y > canvas.height - 100) {
                    // إعادة ظهوره من جديد بعد السقوط
                    resetBird();
                }
            }
        }

        function resetBird() {
            bird.x = Math.random() * (canvas.width - 200) + 100;
            bird.y = Math.random() * 150 + 50;
            bird.speedX = (Math.random() - 0.5) * 6;
            bird.speedY = (Math.random() - 0.5) * 4;
            if(bird.speedX === 0) bird.speedX = 2;
            bird.alive = true;
        }

        // رسم خلفية الحقل، الصياد، السلة، والكلب
        function drawScene() {
            // السماء
            ctx.fillStyle = "#87CEEB";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // الأرض / الحقل
            ctx.fillStyle = "#228B22";
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);

            // --- رسم الصياد وبجواره السلة ---
            // جسم الصياد
            ctx.fillStyle = "#00008B";
            ctx.fillRect(100, canvas.height - 180, 40, 80);
            // رأس الصياد
            ctx.beginPath();
            ctx.arc(120, canvas.height - 195, 15, 0, Math.PI * 2);
            ctx.fillStyle = "#FFDAB9";
            ctx.fill();
            ctx.closePath();
            // البندقية
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(120, canvas.height - 150);
            ctx.lineTo(160, canvas.height - 160);
            ctx.stroke();

            // السلة بجوار الصياد
            ctx.fillStyle = "#D2B48C";
            ctx.fillRect(50, canvas.height - 130, 40, 30);
            ctx.strokeStyle = "#8B4513";
            ctx.lineWidth = 2;
            ctx.strokeRect(50, canvas.height - 130, 40, 30);

            // --- رسم الكلب ---
            ctx.fillStyle = "#A0522D";
            // جسم الكلب
            ctx.fillRect(170, canvas.height - 120, 50, 25);
            // رأس الكلب
            ctx.fillRect(210, canvas.height - 135, 20, 20);
            // أرجل الكلب
            ctx.fillRect(180, canvas.height - 95, 6, 15);
            ctx.fillRect(205, canvas.height - 95, 6, 15);

            // --- رسم لوحة النتائج في الأعلى ---
            ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
            ctx.fillRect(0, 0, canvas.width, 40);
            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.fillText("النقاط: " + score, 30, 27);
            ctx.fillText("الذخيرة: " + ammo, canvas.width - 120, 27);

            // --- رسم الطائر (الفريسة) ---
            if (bird.alive) {
                ctx.fillStyle = "#FF4500";
                ctx.beginPath();
                ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();
                // أجنحة بسيطة
                ctx.fillStyle = "#FF8C00";
                ctx.beginPath();
                ctx.arc(bird.x, bird.y - 10, 10, 0, Math.PI);
                ctx.fill();
                ctx.closePath();
            } else {
                // شكل الطائر الساقط
                ctx.fillStyle = "#8B0000";
                ctx.beginPath();
                ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();
            }
        }

        // حلقة اللعبة الرئيسية
        function gameLoop() {
            updateBird();
            drawScene();
            requestAnimationFrame(gameLoop);
        }

        // التفاعل عند النقر (إطلاق النار)
        canvas.addEventListener("click", function(event) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;

            // حساب المسافة بين النقر ومكان الطائر
            const distance = Math.hypot(mouseX - bird.x, mouseY - bird.y);

            if (bird.alive && distance < bird.radius + 10) {
                bird.alive = false;
                score += 10; // زيادة النقاط عند الإصابة
            }
        });

        // بدء اللعبة
        gameLoop();
    </script>

</body>
</html>
